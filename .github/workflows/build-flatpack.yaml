on:
  push:
    branches: [main, master]
  pull_request:

name: build-flatpak.yaml

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Extract version from CITATION.cff
      run: |
        # Extract version from CITATION.cff

        version=$( \
          grep '^version:' CITATION.cff \
            | sed 's/version: *//' \
            | tr -d '"' \
            | tr -d "'" \
        )

        echo "PACKAGE_VERSION=$version" >> $GITHUB_ENV
      shell: bash

    - name: Build Flatpak
      uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: "logopak-v${{ env.PACKAGE_VERSION }}.flatpak"
        manifest-path: flatpak/com.danielvartan.logopak.yaml
        cache-key: flatpak-builder-${{ github.sha }}
        mirror-screenshots-url: https://dl.flathub.org/media

  lint:
    name: Lint manifest
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Validate metadata
      run: |
        # Validate metadata

        appstreamcli validate --no-net \
          flatpak/com.danielvartan.logopak.metainfo.xml
        for file in flatpak/desktop/*.desktop; do
          desktop-file-validate --no-hints "$file"
        done

    - name: Lint manifests
      # Once Flathub grants the exception, drop `continue-on-error: true`
      # and have the job fail properly on regressions.
      continue-on-error: true
      run: |
        # Lint manifests

        flatpak install -y --noninteractive flathub org.flatpak.Builder

        # The linter runs flatpak-builder, which puts its state directory in
        # the working directory. The workspace is not writable by the user
        # this container runs as, so work from a temporary directory and point
        # the linter at the manifests by absolute path.
        cd "${RUNNER_TEMP}"

        for file in flatpak/com.danielvartan.logopak.yaml \
                    flathub/com.danielvartan.logopak.yaml; do
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            manifest "${GITHUB_WORKSPACE}/${file}"
        done
