on:
  push:
    branches: [main, master]
  pull_request:

name: build-flatpak.yaml

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Extract version from CITATION.cff
      run: |
        # Extract version from CITATION.cff

        version=$( \
          grep '^version:' CITATION.cff \
            | sed 's/version: *//' \
            | tr -d '"' \
            | tr -d "'" \
        )

        echo "PACKAGE_VERSION=$version" >> $GITHUB_ENV
      shell: bash

    - name: Build Flatpak
      uses: flatpak/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: "logopak-v${{ env.PACKAGE_VERSION }}.flatpak"
        manifest-path: flatpak/com.danielvartan.logopak.yaml
        cache-key: flatpak-builder-${{ github.sha }}
        mirror-screenshots-url: https://dl.flathub.org/media

  lint:
    name: Lint manifest
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Validate metadata
      run: |
        # Validate metadata

        appstreamcli validate --no-net \
          flatpak/com.danielvartan.logopak.metainfo.xml
        for file in flatpak/desktop/*.desktop; do
          desktop-file-validate --no-hints "$file"
        done

    - name: Lint manifests
      env:
        # Errors that are known and accepted. `--filesystem=home` is one that
        # Flathub has to grant an exception for, so it is reported on every
        # run. Remove it from here once that exception is in place.
        ALLOWED_ERRORS: finish-args-home-filesystem-access
      run: |
        # Lint manifests

        flatpak install -y --noninteractive flathub org.flatpak.Builder

        # The linter runs flatpak-builder, which creates its state directory in
        # the working directory. Nothing the runner mounts is writable from
        # inside the Flatpak sandbox, so run from the sandbox's own /tmp, which
        # is private to it, and point the linter at the manifests by absolute
        # path.
        #
        # The linter exits non-zero for the accepted errors as well, so the
        # output is read instead of the exit code, and every manifest is
        # checked before the step gives its verdict.
        status=0

        for file in flatpak/com.danielvartan.logopak.yaml \
                    flathub/com.danielvartan.logopak.yaml; do
          echo "::group::${file}"

          flatpak run --command=sh org.flatpak.Builder -c \
            "cd /tmp && flatpak-builder-lint manifest '${GITHUB_WORKSPACE}/${file}'" \
            > lint.json || true
          cat lint.json

          python3 - "$file" <<'PY' || status=1
        import json, os, sys

        allowed = set(os.environ["ALLOWED_ERRORS"].split())

        # A linter that crashed writes nothing to stdout. Treat that as a
        # failure, so that a broken run cannot pass for a clean one.
        try:
            with open("lint.json") as file:
                report = json.load(file)
        except (OSError, ValueError):
            print(f"::error file={sys.argv[1]}::The linter produced no report")
            sys.exit(1)

        found = set(report.get("errors", [])) | set(report.get("warnings", []))
        unexpected = sorted(found - allowed)

        if unexpected:
            print(f"::error file={sys.argv[1]}::Unexpected: {', '.join(unexpected)}")
            sys.exit(1)
        PY

          echo "::endgroup::"
        done

        exit "${status}"
