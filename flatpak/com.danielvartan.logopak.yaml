app-id: com.danielvartan.logopak
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: NetLogo

sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17

finish-args:
  - --device=dri
  - --filesystem=home
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=x11
  - --socket=wayland
  - --talk-name=org.freedesktop.portal.Desktop
  # The shell launchers shipped by NetLogo (netlogo-headless.sh,
  # netlogo-gui.sh, behaviorsearch_headless.sh) look for a JDK in JAVA_HOME.
  # The runtime default points to /usr/lib/jvm/java-21-openjdk, which is not
  # part of org.freedesktop.Platform, so point it at NetLogo's own runtime.
  - --env=JAVA_HOME=/app/opt/netlogo/lib/runtime

modules:
  - name: netlogo
    buildsystem: simple
    build-commands:
      # Install NetLogo files (archive extracts directly to build dir)
      - mkdir -p /app/opt/netlogo
      - cp -r * /app/opt/netlogo/

      # Create symlinks for executables
      - mkdir -p /app/bin
      - |
        for file in HubNetClient BehaviorSearch; do
          ln -s /app/opt/netlogo/bin/${file} /app/bin/${file}
        done

      # NetLogo and NetLogo 3D go through a launcher that picks the graphical
      # or the batch entry point, so that "NetLogo --headless" works from the
      # same command name as the graphical one.
      - install -Dm755 netlogo-launcher.sh /app/opt/netlogo/netlogo-launcher.sh
      - |
        ln -s /app/opt/netlogo/netlogo-launcher.sh /app/bin/NetLogo
        ln -s /app/opt/netlogo/netlogo-launcher.sh /app/bin/NetLogo3D

      # Create lowercase command aliases
      - |
        ln -s /app/opt/netlogo/netlogo-launcher.sh /app/bin/netlogo
        ln -s /app/opt/netlogo/netlogo-launcher.sh /app/bin/netlogo3d
        ln -s /app/opt/netlogo/bin/HubNetClient /app/bin/hubnetclient
        ln -s /app/opt/netlogo/bin/BehaviorSearch /app/bin/behaviorsearch

      # Install desktop files
      - install -Dm644 com.danielvartan.logopak.NetLogo.desktop /app/share/applications/com.danielvartan.logopak.NetLogo.desktop
      - install -Dm644 com.danielvartan.logopak.NetLogo3D.desktop /app/share/applications/com.danielvartan.logopak.NetLogo3D.desktop
      - install -Dm644 com.danielvartan.logopak.HubNetClient.desktop /app/share/applications/com.danielvartan.logopak.HubNetClient.desktop
      - install -Dm644 com.danielvartan.logopak.BehaviorSearch.desktop /app/share/applications/com.danielvartan.logopak.BehaviorSearch.desktop

      # Install application icons
      - install -Dm644 NetLogo-512x512.png /app/share/icons/hicolor/256x256/apps/com.danielvartan.logopak.NetLogo.png
      - install -Dm644 NetLogo3D-512x512.png /app/share/icons/hicolor/256x256/apps/com.danielvartan.logopak.NetLogo3D.png
      - install -Dm644 HubNetClient-512x512.png /app/share/icons/hicolor/256x256/apps/com.danielvartan.logopak.HubNetClient.png
      - install -Dm644 BehaviorSearch-512x512.png /app/share/icons/hicolor/256x256/apps/com.danielvartan.logopak.BehaviorSearch.png

      # Install MIME type icons (for file associations)
      - install -Dm644 Model-512x512.png /app/share/icons/hicolor/512x512/mimetypes/com.danielvartan.logopak.model.png
      - install -Dm644 BehaviorSearchModel-512x512.png /app/share/icons/hicolor/512x512/mimetypes/com.danielvartan.logopak.behaviorsearch.png

      # Install MIME type definitions (for file associations)
      - install -Dm644 com.danielvartan.logopak.xml /app/share/mime/packages/com.danielvartan.logopak.xml

      # Install AppStream metadata
      - install -Dm644 com.danielvartan.logopak.metainfo.xml /app/share/metainfo/com.danielvartan.logopak.metainfo.xml

      # Build the Java agent that restores Desktop.Action.BROWSE support.
      # JDK 17 removes BROWSE from XDesktopPeer.supportedActions because GVfs
      # inside the Flatpak only reports "file"/"resource" URI schemes, not
      # "http".
      # The agent uses reflection to add BROWSE back after init completes.
      # It is compiled here with the same JDK version that NetLogo bundles, so
      # the shipped jar can never be a stale or truncated binary.
      - |
        set -e
        . /usr/lib/sdk/openjdk17/enable.sh
        mkdir -p browse-fix/classes
        javac -d browse-fix/classes BrowseFix.java
        printf 'Premain-Class: BrowseFix\n' > browse-fix/manifest.txt
        jar --create --file browse-fix/browse-fix.jar \
          --manifest browse-fix/manifest.txt -C browse-fix/classes .
        # Fail the build here instead of shipping a jar the JVM cannot open.
        jar --list --file browse-fix/browse-fix.jar
        install -Dm644 browse-fix/browse-fix.jar \
          /app/opt/netlogo/lib/app/browse-fix.jar
        rm -f /app/opt/netlogo/BrowseFix.java

      # Attach the agent to the graphical launchers. The path is written as
      # $APPDIR/browse-fix.jar (jpackage expands it at launch) instead of an
      # absolute /app path: a -javaagent that cannot be resolved aborts the JVM
      # before it starts, so the option must stay valid wherever the app image
      # is mounted (flatpak-builder build dir, `flatpak build` shell, bundle).
      - |
        for cfg in /app/opt/netlogo/lib/app/*.cfg; do
          printf '\njava-options=-javaagent:$APPDIR/browse-fix.jar\n' >> "$cfg"
          printf 'java-options=--add-opens\n' >> "$cfg"
          printf 'java-options=java.desktop/sun.awt.X11=ALL-UNNAMED\n' >> "$cfg"
        done

      # Expose the bundled JDK, so that NetLogo's own shell launchers and any
      # script the user points at them find a JVM.
      - ln -s /app/opt/netlogo/lib/runtime/bin/java /app/bin/java

      # BehaviorSearch has no --headless flag to switch on, so its batch entry
      # point gets its own command.
      - |
        printf '#!/bin/sh\nexec "%s" "$@"\n' \
          /app/opt/netlogo/behaviorsearch/behaviorsearch_headless.sh \
          > /app/bin/behaviorsearch-headless
        chmod 755 /app/bin/behaviorsearch-headless
    sources:
      - type: archive
        url: https://downloads.netlogo.org/7.0.4/NetLogo-7.0.4-64.tgz
        sha256: 75636b8469ea4995ec051cfbc91e525f171be84b8f959b86bc080fbff702dfbc
      - type: file
        path: com.danielvartan.logopak.metainfo.xml
      - type: file
        path: com.danielvartan.logopak.xml
      - type: file
        path: BrowseFix.java
      - type: file
        path: netlogo-launcher.sh
      - type: dir
        path: desktop
      - type: dir
        path: icons
